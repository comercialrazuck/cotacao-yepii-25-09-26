[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  included_files = ["index.html"]

[[redirects]]
  from = "/api/save-quote"
  to = "/.netlify/functions/save-quote"
  status = 200
[[redirects]]
  from = "/api/get-quote"
  to = "/.netlify/functions/get-quote"
  status = 200
[[redirects]]
  from = "/api/accept-quote"
  to = "/.netlify/functions/accept-quote"
  status = 200
[[redirects]]
  from = "/api/reject-quote"
  to = "/.netlify/functions/reject-quote"
  status = 200
[[redirects]]
  from = "/api/list-quotes"
  to = "/.netlify/functions/list-quotes"
  status = 200
[[redirects]]
  from = "/api/admin-get-quote"
  to = "/.netlify/functions/admin-get-quote"
  status = 200
[[redirects]]
  from = "/api/delete-draft"
  to = "/.netlify/functions/delete-draft"
  status = 200
[[redirects]]
  from = "/api/next-quote-number"
  to = "/.netlify/functions/next-quote-number"
  status = 200
[[redirects]]
  from = "/api/reports"
  to = "/.netlify/functions/reports"
  status = 200
[[redirects]]
  from = "/api/team-users"
  to = "/.netlify/functions/team-users"
  status = 200
[[redirects]]
  from = "/api/resend-webhook"
  to = "/.netlify/functions/resend-webhook"
  status = 200
[[redirects]]
  from = "/relatorios"
  to = "/reports.html"
  status = 200
[[redirects]]
  from = "/relatorios/"
  to = "/reports.html"
  status = 200
[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/app-shell"
  status = 200
[[redirects]]
  from = "/admin/"
  to = "/.netlify/functions/app-shell"
  status = 200
[[redirects]]
  from = "/c/*"
  to = "/.netlify/functions/app-shell"
  status = 200
