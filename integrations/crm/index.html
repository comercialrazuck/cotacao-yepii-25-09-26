<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yepii CRM V6.9 · Leads organizados</title>
<style>
:root{--orange:#ff6600;--black:#111;--muted:#6b7280;--bg:#f5f5f5;--border:#e5e7eb}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--black)}
button,input,select,textarea{font:inherit} .wrap{max-width:1180px;margin:auto;padding:20px}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px}
.top{display:flex;justify-content:space-between;gap:14px;align-items:center} .brand{display:flex;align-items:center;gap:10px}
.brand img{height:46px;width:auto} .nav{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0}
.nav button,.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
.nav button{background:#fff;border:1px solid var(--border)} .nav button.active,.btn{background:var(--orange);color:#fff}
.btn.alt{background:#fff;color:#111;border:1px solid var(--border)} .muted{color:var(--muted);font-size:13px}
.search{flex:1;max-width:450px} input,select,textarea{width:100%;border:1px solid #d1d5db;border-radius:9px;padding:10px 12px;background:#fff}
.field{margin:9px 0} .field label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px} .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi b{display:block;font-size:25px;margin-top:6px} .sectionTitle{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}
.sectionTitle h2{margin:0} .table{width:100%;border-collapse:collapse} .table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #eee;font-size:13px}
.scroll{overflow:auto} .badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;background:#eee}
.good{background:#e7f7ed;color:#126b37} .warn{background:#fff4db;color:#7a5200} .bad{background:#fde8e8;color:#8d1b1b}
.alert{border-left:5px solid var(--orange);padding:12px;background:#fff7f2;border-radius:8px;margin:8px 0}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:99}
.modal .card{width:min(760px,100%);max-height:90vh;overflow:auto} .login{max-width:430px;margin:60px auto}
.login .brand{justify-content:center;margin-bottom:18px} .login .brand img{height:62px} .row{display:flex;gap:10px;flex-wrap:wrap}
@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}.search{max-width:none;width:100%}.table{min-width:760px}}
@media(max-width:430px){.grid{grid-template-columns:1fr}}
.interaction-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:10px 0}.interaction-toolbar .field{margin:0;min-width:160px;flex:1}.interaction-card{border-left:4px solid #ddd}.interaction-card.attention{border-left-color:#f59e0b}.interaction-card.overdue{border-left-color:#dc2626}.interaction-meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.interaction-actions{display:flex;gap:7px;flex-wrap:wrap}.interaction-history{border-top:1px dashed #ddd;margin-top:8px;padding-top:8px}.interaction-alert-box{margin:12px 0;padding:12px;border:1px solid #f4c68c;background:#fff8ed;border-radius:10px}.interaction-alert-box.bad{border-color:#efb4b4;background:#fff2f2}.interaction-next{margin-top:8px;padding:8px 10px;background:#f8fafc;border-radius:8px}.interaction-empty{padding:10px 0;color:var(--muted)}
.dashboard-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.chart-card{min-height:300px}.chart-card h3{margin:0 0 4px}.chart-wrap{display:flex;align-items:center;gap:22px;min-height:220px}.pie{width:170px;height:170px;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 0 0 1px #eee}.legend{display:grid;gap:8px;flex:1}.legend-row{display:flex;justify-content:space-between;gap:12px;font-size:13px}.legend-label{display:flex;align-items:center;gap:7px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.toolbar{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.toolbar .field{margin:0;min-width:180px}.progress{height:10px;border-radius:999px;background:#eee;overflow:hidden}.progress>span{display:block;height:100%;background:var(--orange)}.goal-box{padding:14px;border:1px solid var(--border);border-radius:12px;background:#fff}.goal-box strong{font-size:22px;display:block;margin:4px 0}.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.trend-bars{display:flex;align-items:end;gap:12px;height:190px;padding:20px 8px 0}.trend-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:6px}.trend-bar{width:70%;max-width:44px;background:var(--orange);border-radius:7px 7px 2px 2px;min-height:2px}.trend-label{font-size:11px;color:var(--muted);text-align:center}.trend-value{font-size:11px;font-weight:700}@media(max-width:850px){.dashboard-grid{grid-template-columns:1fr}.chart-wrap{flex-direction:column}.mini-grid{grid-template-columns:1fr}}

.company-search-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.company-search-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.company-result{display:grid;grid-template-columns:34px 1.3fr .8fr .8fr .8fr;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid #eee}.company-result:last-child{border-bottom:0}.company-result .small{font-size:12px;color:var(--muted)}.search-summary{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.search-summary .badge{padding:6px 10px}.cost-note{padding:10px 12px;border-radius:10px;background:#fff8f2;border:1px solid #f0d5bd}.source-note{font-size:12px;color:var(--muted)}@media(max-width:900px){.company-search-grid{grid-template-columns:1fr 1fr}.company-result{grid-template-columns:30px 1fr}}@media(max-width:520px){.company-search-grid{grid-template-columns:1fr}}

.sort-head{background:none;border:0;padding:0;cursor:pointer;font-weight:700;color:inherit;white-space:nowrap}.sort-head:hover{color:var(--orange)}.lead-pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}.lead-pager .row{align-items:center}.credit-nd{font-weight:800;color:#8d1b1b}.credit-na{font-weight:700;color:var(--muted)}
.lead-filterbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:0 0 10px}.lead-filterbar .field{margin:0;min-width:190px}.lead-quickfilters{display:flex;gap:6px;flex-wrap:wrap}.lead-filter-btn{border:1px solid var(--border);background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;cursor:pointer}.lead-filter-btn:hover{border-color:var(--orange);color:var(--orange)}.lead-filter-btn.active{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700}
.lead-scroll-top{overflow-x:auto;overflow-y:hidden;margin:0 0 7px;height:18px;position:sticky;top:0;z-index:60;background:#fff;padding-top:2px}.lead-scroll-spacer{height:1px}.lead-table-shell{padding:0!important;overflow:visible}.lead-scroll-bottom{overflow:auto;max-height:68vh;position:relative;border-radius:10px}.lead-table{min-width:1840px;border-collapse:separate;border-spacing:0}.lead-table th,.lead-table td{padding:7px 9px;font-size:12px;white-space:nowrap;background:#fff}.lead-table tbody tr:nth-child(even) td{background:#fafafa}.lead-table tbody tr:hover td{background:#fff7f2}.lead-table thead th{position:sticky;top:0;z-index:20;background:#f4f4f4;border-bottom:2px solid #ddd;box-shadow:0 1px 0 #ddd}.lead-activity{width:270px;max-width:270px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lead-company{font-weight:700;width:240px;max-width:240px;overflow:hidden;text-overflow:ellipsis}.lead-col-id{position:sticky!important;left:0;z-index:25!important;width:95px;min-width:95px;max-width:95px}.lead-col-company{position:sticky!important;left:95px;z-index:24!important;min-width:240px;max-width:240px}.lead-col-action{position:sticky!important;right:0;z-index:24!important;width:78px;min-width:78px;text-align:center}.lead-table thead .lead-col-id,.lead-table thead .lead-col-company,.lead-table thead .lead-col-action{z-index:40!important;background:#ededed}.lead-table tbody tr:nth-child(even) .lead-col-id,.lead-table tbody tr:nth-child(even) .lead-col-company,.lead-table tbody tr:nth-child(even) .lead-col-action{background:#fafafa}.lead-table tbody tr:hover .lead-col-id,.lead-table tbody tr:hover .lead-col-company,.lead-table tbody tr:hover .lead-col-action{background:#fff7f2}.lead-col-company{box-shadow:2px 0 4px #0000000b}.lead-col-action{box-shadow:-2px 0 4px #0000000b}.lead-status-badge{font-weight:700}.lead-filter-summary{font-size:12px;color:var(--muted);margin-left:auto;align-self:center}
</style>

let cache={leads:[],acts:[],orders:[],orderItems:[],orderHistory:[],orderDocuments:[],analyses:[],team:[],contacts:[],tasks:[],weeklyTargets:[],userTargets:[],creditEvents:[],bdcQueries:[]};
let dashboardScope='geral';
let companySearchState={results:[],nextCursor:null,total:null,meta:null,filters:null,selected:new Set(),usage:null,group:null};
let leadListState={sortKey:'company',sortDir:'asc',page:1,pageSize:15,query:'',quickFilter:'all',ownerFilter:'all'};
const app=document.getElementById('app');
const $=s=>document.querySelector(s);
const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'-';
function monday(){let d=new Date(),x=(d.getDay()+6)%7;d.setDate(d.getDate()-x);return d.toISOString().slice(0,10)}
function brand(){return `<div class="brand"><img src="${LOGO}" alt="Yepii"><b>CRM</b></div>`}

function login(){
 app.innerHTML=`<div class="wrap"><div class="card login">${brand()}
 <h2>Acesso ao CRM</h2><p class="muted">Entre com seu e-mail corporativo. Na primeira vez, use “Criar conta”.</p>
 <div class="field"><label>E-mail</label><input id="email" type="email"></div>
 <div class="field"><label>Senha</label><input id="pass" type="password"></div>
 <div class="row"><button class="btn" id="in">Entrar</button><button class="btn alt" id="up">Criar conta</button></div>

function pieData(items){
 const total=items.reduce((s,x)=>s+Number(x.value||0),0);
 const palette=['#ff6600','#242424','#7c7c7c','#d9d9db','#ff9d5c','#8a4b20','#b8b8b8','#ffd0b0'];
 let acc=0,parts=[];
 items.forEach((x,i)=>{let pct=total?Number(x.value||0)/total*100:0;parts.push(`${palette[i%palette.length]} ${acc}% ${acc+pct}%`);acc+=pct});
 return {total,gradient:total?`conic-gradient(${parts.join(',')})`:'conic-gradient(#eee 0 100%)',palette};
}
function pieCard(title,subtitle,items){

}

}

 if(key==='company')return String(l.company_name||'').toLowerCase();

function leads(q=''){
 let s=q.toLowerCase();
 if(leadListState.query!==s){leadListState.query=s;leadListState.page=1}
 let contactLeadIds=new Set(cache.contacts.filter(c=>[c.full_name,c.phone,c.whatsapp,c.email,c.linkedin].some(v=>String(v||'').toLowerCase().includes(s))).map(c=>c.lead_id));
 let searched=cache.leads.filter(x=>!x.deleted_at).filter(x=>!s||[x.lead_code,x.cnpj,x.company_name,x.segment,x.main_activity,x.main_cnae].some(v=>String(v||'').toLowerCase().includes(s))||contactLeadIds.has(x.id));
 let ls=searched.filter(x=>leadQuickFilterMatch(x,leadListState.quickFilter)&&leadOwnerFilterMatch(x,leadListState.ownerFilter));
 const dir=leadListState.sortDir==='asc'?1:-1,key=leadListState.sortKey;
 ls=ls.slice().sort((a,b)=>{const av=leadSortValue(a,key),bv=leadSortValue(b,key);if(typeof av==='number'&&typeof bv==='number')return (av-bv)*dir;return String(av).localeCompare(String(bv),'pt-BR',{numeric:true,sensitivity:'base'})*dir});
 const total=ls.length,pages=Math.max(1,Math.ceil(total/leadListState.pageSize));
 if(leadListState.page>pages)leadListState.page=pages;
 const from=(leadListState.page-1)*leadListState.pageSize, pageRows=ls.slice(from,from+leadListState.pageSize);
 const quick=[['all','Todos'],['nao_contatado','Não contatados'],['em_contato','Em contato'],['comprou','Compraram'],['approved','Crédito aprovado'],['denied','ND'],['not_analyzed','Sem análise']];
 const owners=`<option value="all" ${leadListState.ownerFilter==='all'?'selected':''}>Todos os responsáveis</option><option value="unassigned" ${leadListState.ownerFilter==='unassigned'?'selected':''}>Sem responsável</option>${cache.team.filter(x=>x.active).map(u=>`<option value="${u.user_id}" ${String(leadListState.ownerFilter)===String(u.user_id)?'selected':''}>${esc(userName(u.user_id))}</option>`).join('')}`;
 $('#main').innerHTML=`<div class="sectionTitle"><div><h2>Leads</h2><div class="muted">${total} lead(s) exibido(s) · ${searched.length} encontrado(s) na busca · 15 por página</div></div><button class="btn" id="add">+ Novo lead</button></div>
 <div class="lead-filterbar"><div><label class="muted" style="display:block;margin-bottom:5px">Filtros rápidos</label><div class="lead-quickfilters">${quick.map(([k,label])=>`<button class="lead-filter-btn ${leadListState.quickFilter===k?'active':''}" data-lead-filter="${k}">${label}</button>`).join('')}</div></div><div class="field"><label>Responsável</label><select id="leadOwnerFilter">${owners}</select></div><button class="btn alt" id="leadClearFilters">Limpar filtros</button><span class="lead-filter-summary">Cabeçalho, ID, Empresa e Abrir permanecem visíveis durante a navegação.</span></div>
 <div class="lead-scroll-top" id="leadScrollTop"><div class="lead-scroll-spacer" id="leadScrollSpacer"></div></div>
 <div class="card lead-table-shell"><div class="lead-scroll-bottom" id="leadScrollBottom"><table class="table lead-table" id="leadTable"><thead><tr><th class="lead-col-id">ID</th><th class="lead-col-company">${sortHead('company','Empresa')}</th><th>${sortHead('activity','Atividade principal')}</th><th>CNPJ</th><th>${sortHead('owner','Responsável')}</th><th>${sortHead('score','Score')}</th><th>${sortHead('capital','Capital social')}</th><th>${sortHead('age','Tempo empresa')}</th><th>${sortHead('bigdata','Última BigData')}</th><th>${sortHead('entry','Entrada CRM')}</th><th>${sortHead('credit','Crédito')}</th><th>${sortHead('status','Status')}</th><th class="lead-col-action">Abrir</th></tr></thead>
 <tbody>${pageRows.map(x=>{const qx=latestBdcQuery(x.id);return `<tr><td class="lead-col-id">${esc(x.lead_code)}</td><td class="lead-col-company lead-company" title="${esc(x.company_name||'')}">${esc(x.company_name)}</td><td class="lead-activity" title="${esc(x.main_activity||'')}">${esc(x.main_activity||'-')}</td><td>${esc(x.cnpj)}</td><td>${esc(userName(x.assigned_to)||'Sem responsável')}</td><td>${Math.round(Number(x.score_avg||0))||'-'}</td><td>${x.capital_social!=null?money(x.capital_social):'-'}</td><td>${esc(formatLeadAge(x))}</td><td>${esc(formatBdcDate(qx))}</td><td>${esc(formatLeadEntry(x))}</td><td>${creditDisplay(x)}</td><td><span class="badge lead-status-badge">${esc(leadStatusLabel(x.status))}</span></td><td class="lead-col-action"><button class="btn alt open" data-id="${x.id}">Abrir</button></td></tr>`}).join('')}</tbody></table></div>
 <div class="lead-pager" style="padding:0 12px 12px"><div class="muted">Mostrando ${total?from+1:0}–${Math.min(from+leadListState.pageSize,total)} de ${total}</div><div class="row"><button class="btn alt" id="leadPrev" ${leadListState.page<=1?'disabled':''}>‹ Anterior</button><span><b>Página ${leadListState.page}</b> de ${pages}</span><button class="btn alt" id="leadNext" ${leadListState.page>=pages?'disabled':''}>Próxima ›</button></div></div></div>`;
 $('#add').onclick=newLead;
 const leadTop=$('#leadScrollTop'),leadBottom=$('#leadScrollBottom'),leadTable=$('#leadTable'),leadSpacer=$('#leadScrollSpacer');
 if(leadTop&&leadBottom&&leadTable&&leadSpacer){
   const syncLeadScrollWidth=()=>{leadSpacer.style.width=leadTable.scrollWidth+'px'};
   syncLeadScrollWidth(); requestAnimationFrame(syncLeadScrollWidth);
   let syncingLeadScroll=false;
   leadTop.onscroll=()=>{if(syncingLeadScroll)return;syncingLeadScroll=true;leadBottom.scrollLeft=leadTop.scrollLeft;syncingLeadScroll=false};
   leadBottom.onscroll=()=>{if(syncingLeadScroll)return;syncingLeadScroll=true;leadTop.scrollLeft=leadBottom.scrollLeft;syncingLeadScroll=false};
 }
 document.querySelectorAll('.open').forEach(b=>b.onclick=()=>safeLeadDetail(b.dataset.id));
 document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{const k=b.dataset.sort;if(leadListState.sortKey===k)leadListState.sortDir=leadListState.sortDir==='asc'?'desc':'asc';else{leadListState.sortKey=k;leadListState.sortDir='asc'}leadListState.page=1;leads(leadListState.query)});
 document.querySelectorAll('[data-lead-filter]').forEach(b=>b.onclick=()=>{leadListState.quickFilter=b.dataset.leadFilter;leadListState.page=1;leads(leadListState.query)});
 $('#leadOwnerFilter').onchange=e=>{leadListState.ownerFilter=e.target.value;leadListState.page=1;leads(leadListState.query)};
 $('#leadClearFilters').onclick=()=>{leadListState.quickFilter='all';leadListState.ownerFilter='all';leadListState.page=1;leads(leadListState.query)};
 $('#leadPrev').onclick=()=>{if(leadListState.page>1){leadListState.page--;leads(leadListState.query)}};
 $('#leadNext').onclick=()=>{if(leadListState.page<pages){leadListState.page++;leads(leadListState.query)}};
}


function modal(body){
 let d=document.createElement('div'); d.className='modal'; d.innerHTML=`<div class="card">${body}<div style="margin-top:12px"><button class="btn alt close">Fechar</button></div></div>`;
 document.body.appendChild(d); d.querySelector('.close').onclick=()=>d.remove(); return d;
}

function newLead(){
 let previewId=null;
 let d=modal(`<h2>Novo lead</h2>
 <p class="muted">Digite o CNPJ. Primeiro a Yepii consulta e mostra os dados cadastrais. O lead só será criado depois da sua confirmação.</p>
 <div class="field"><label>CNPJ</label><input id="cnpj" placeholder="00.000.000/0000-00"></div>
 <button class="btn" id="lookup">Consultar cadastro</button>
 <div id="err" class="muted" style="margin-top:10px"></div>
 <div id="preview" style="margin-top:12px"></div>`);
 d.querySelector('#lookup').onclick=async()=>{
   const cnpj=d.querySelector('#cnpj').value.replace(/\D/g,'');
   if(cnpj.length!==14){d.querySelector('#err').textContent='Digite um CNPJ válido com 14 números.';return}
   d.querySelector('#lookup').disabled=true; d.querySelector('#err').textContent='Consultando dados cadastrais na BigDataCorp...';
   try{
     const {data:{session}}=await supabase.auth.getSession(); if(!session?.access_token) throw new Error('Sua sessão expirou. Saia e entre novamente.');
     const {data,error}=await supabase.functions.invoke('yepii-bigdatacorp-create-lead',{body:{action:'preview',cnpj,user_token:session.access_token}});
     if(error) throw error; if(data?.error) throw new Error(data.error);
     if(data?.existing){d.querySelector('#err').textContent='Este CNPJ já está cadastrado no CRM.'; d.querySelector('#preview').innerHTML=`<div class="card"><b>${esc(data.lead?.lead_code||'')}</b><div>${esc(data.lead?.company_name||'')}</div></div>`; return}
     previewId=data?.preview_id; const b=data?.basic_data||{};
     d.querySelector('#err').textContent='Consulta concluída. Confira os dados antes de criar o lead.';
     d.querySelector('#preview').innerHTML=`<div class="card">
       <h3 style="margin-top:0">${esc(b.trade_name||b.official_name||'Empresa')}</h3>
       <div><b>Razão social:</b> ${esc(b.official_name||'-')}</div><div><b>Situação Receita:</b> ${esc(b.receita_status||'-')}</div>
       <div><b>Abertura:</b> ${esc(b.opening_date||'-')}</div><div><b>Idade:</b> ${esc(b.age??'-')} anos</div><div><b>UF:</b> ${esc(b.state||'-')}</div>
       <div><b>Porte:</b> ${esc(b.company_size||'-')}</div><div><b>Natureza jurídica:</b> ${esc(b.legal_nature||'-')}</div>
       <div><b>CNAE principal:</b> ${esc(b.main_cnae||'-')} · ${esc(b.main_activity||'-')}</div>
       <div><b>Endereço:</b> ${b.address?[b.address.street,b.address.street_number,b.address.address_complement,b.address.neighborhood,b.address.city,b.address.state,b.address.postal_code].filter(Boolean).map(esc).join(', '):'-'}</div>
       <div class="row" style="margin-top:14px"><button class="btn" id="confirmLead">Criar lead</button><button class="btn alt" id="cancelLead">Não criar</button></div>
     </div>`;
     d.querySelector('#cancelLead').onclick=()=>{previewId=null;d.querySelector('#preview').innerHTML='';d.querySelector('#err').textContent='Consulta descartada. Nenhum lead foi criado.'};
     d.querySelector('#confirmLead').onclick=async()=>{
       if(!previewId)return; const btn=d.querySelector('#confirmLead');btn.disabled=true;d.querySelector('#err').textContent='Criando lead...';
       try{const {data:{session}}=await supabase.auth.getSession(); const {data,error}=await supabase.functions.invoke('yepii-bigdatacorp-create-lead',{body:{action:'confirm',preview_id:previewId,user_token:session.access_token}}); if(error)throw error;if(data?.error)throw new Error(data.error);d.querySelector('#err').textContent='Lead criado com sucesso.';await refresh();setTimeout(()=>d.remove(),500)}catch(e){d.querySelector('#err').textContent='Erro ao criar lead: '+(e?.message||e);btn.disabled=false}
     };
   }catch(e){d.querySelector('#err').textContent='Erro na consulta: '+(e?.message||e)} finally{d.querySelector('#lookup').disabled=false}
 };
}

function digits(v){return String(v||'').replace(/\D/g,'')}
function normText(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}
function companyCnpjExists(cnpj){const d=digits(cnpj);return cache.leads.some(l=>digits(l.cnpj)===d&&!l.deleted_at)}
function companyLabelBool(v){return v===true?'Sim':v===false?'Não':'-'}
function companyApiMessage(e){
 const m=String(e?.message||e||'Erro na consulta');
 if(m.includes('CNPJIA_KEY_NOT_CONFIGURED')||m.includes('chave da cnpj.ia.br'))return 'A integração está pronta, mas falta configurar a chave da cnpj.ia.br no Supabase.';
 return m;
}
async function companyInvoke(body){
 const {data:{session}}=await supabase.auth.getSession();
 if(!session)throw new Error('Sua sessão expirou. Saia e entre novamente.');
 const {data,error}=await supabase.functions.invoke('yepii-cnpj-search',{body});
 if(error){let extra='';try{extra=await error.context?.text?.()}catch{};throw new Error(extra||error.message||'Falha na busca de empresas')}
 if(data?.error)throw new Error(data.message||data.error);
 return data||{};
}
async function loadMunicipalities(uf,select){
 if(!select)return;
 select.innerHTML='<option value="">Carregando municípios...</option>';select.disabled=true;
 if(!uf){select.innerHTML='<option value="">Todos os municípios</option>';select.disabled=false;return}
 try{
  const r=await fetch('https://servicodados.ibge.gov.br/api/v1/localidades/estados/'+encodeURIComponent(uf)+'/municipios?orderBy=nome');
  if(!r.ok)throw new Error('IBGE indisponível');
  const rows=await r.json();
  select.innerHTML='<option value="">Todos os municípios</option>'+rows.map(x=>`<option value="${esc(x.id)}">${esc(x.nome)}</option>`).join('');
 }catch(e){select.innerHTML='<option value="">Informe só a UF ou tente novamente</option>'}
 finally{select.disabled=false}
}
function currentCompanyVisibleResults(){
 const bairro=normText($('#csBairro')?.value||'');
 const onlyContact=!!$('#csContato')?.checked;
 const hideExisting=$('#csHideExisting')?.checked!==false;
 return companySearchState.results.filter(e=>{
  const b=normText(e?.endereco?.bairro||'');
  if(bairro&&!b.includes(bairro))return false;
  if(onlyContact&&!(e.has_phone||e.has_email||e.has_mobile_phone))return false;
  if(hideExisting&&companyCnpjExists(e.cnpj))return false;
  return true;
 });
}

 if(!companySearchState.results.length){box.innerHTML='<div class="interaction-empty">Faça uma busca para ver as empresas.</div>';return}

 box.innerHTML=rows.map(e=>{

 }).join('');
 box.querySelectorAll('.csPick').forEach(ch=>ch.onchange=()=>{if(ch.checked)companySearchState.selected.add(ch.dataset.cnpj);else companySearchState.selected.delete(ch.dataset.cnpj);$('#csSelectedCount').textContent=companySearchState.selected.size});
 $('#csSelectedCount').textContent=companySearchState.selected.size;

const COMPANY_NATURE_LABELS={
 '1015':'Órgão Executivo Federal','1023':'Órgão Executivo Estadual/DF','1031':'Órgão Executivo Municipal','1040':'Órgão Legislativo Federal','1058':'Órgão Legislativo Estadual/DF','1066':'Órgão Legislativo Municipal','1074':'Órgão Judiciário Federal','1082':'Órgão Judiciário Estadual','1104':'Autarquia Federal','1112':'Autarquia Estadual/DF','1120':'Autarquia Municipal','1139':'Fundação Pública Federal','1147':'Fundação Pública Estadual/DF','1155':'Fundação Pública Municipal','1163':'Órgão Público Autônomo Federal','1171':'Órgão Público Autônomo Estadual/DF','1180':'Órgão Público Autônomo Municipal','1252':'Fundação Pública de Direito Privado Federal','1260':'Fundação Pública de Direito Privado Estadual/DF','1279':'Fundação Pública de Direito Privado Municipal','1287':'Fundo Público Indireto Federal','1295':'Fundo Público Indireto Estadual/DF','1309':'Fundo Público Indireto Municipal','1317':'Fundo Público Direto Federal','1325':'Fundo Público Direto Estadual/DF','1333':'Fundo Público Direto Municipal','1341':'União','1236':'Estado ou Distrito Federal','1244':'Município','2011':'Empresa Pública','2038':'Sociedade de Economia Mista','2046':'S.A. Aberta','2054':'S.A. Fechada','2062':'Sociedade Empresária Limitada','2135':'Empresário Individual','2143':'Cooperativa','2240':'Sociedade Simples Limitada'};
function entityCodes(entity,sphere){
 if(!entity)return [];
 const v=COMPANY_ENTITY_CODES[entity];
 if(Array.isArray(v))return [...v];
 if(!v)return [];
 if(entity==='public_all'){
  if(sphere&&sphere!=='all')return [...(v[sphere]||[])];
  return [...v.federal,...v.state,...v.municipal,...v.extra];
 }
 if(sphere&&sphere!=='all')return [...(v[sphere]||[])];
 return [...(v.federal||[]),...(v.state||[]),...(v.municipal||[])];
}
function companyNatureCode(e){return digits(e?.natureza_juridica?.codigo||'')}
function companySphereFromNature(code){
 code=digits(code);
 const fed=['1015','1040','1074','1104','1139','1163','1252','1287','1317','1341'];
 const est=['1023','1058','1082','1112','1147','1171','1236','1260','1295','1325'];
 const mun=['1031','1066','1120','1155','1180','1244','1279','1309','1333'];
 if(fed.includes(code))return 'Federal';if(est.includes(code))return 'Estadual/DF';if(mun.includes(code))return 'Municipal';return '';
}
function companyEntityLabel(e){
 const c=companyNatureCode(e);
 if(c==='2011')return 'Empresa pública';if(c==='2038')return 'Economia mista';if(['2046','2054'].includes(c))return 'S.A. privada';if(c.startsWith('1'))return 'Setor público';if(c.startsWith('2'))return 'Empresa privada';return 'Outra entidade';
}
function selectedEntityTypes(){
 return [...document.querySelectorAll('.csEntityType:checked')].map(x=>x.value).filter(Boolean);
}
function updateEntityUi(){
 const types=selectedEntityTypes(),sphere=$('#csSphere'),note=$('#csEntityNote');if(!sphere||!note)return;
 const sphereTypes=['public_body','autarchy','public_foundation','public_all'];
 const hasSphereType=types.some(t=>sphereTypes.includes(t));
 sphere.disabled=!hasSphereType;if(sphere.disabled)sphere.value='all';
 if(!types.length)note.textContent='Nenhum tipo marcado: a busca considera todos os tipos de entidade.';
 else if(hasSphereType&&types.some(t=>['private','sa_private','public_company','mixed_economy'].includes(t)))note.textContent='Você selecionou tipos diferentes. A esfera será aplicada apenas aos órgãos, autarquias e fundações públicas; empresas privadas e estatais sem esfera identificável permanecem na busca.';
 else if(hasSphereType)note.textContent='Você pode marcar vários tipos. A esfera é aplicada aos tipos públicos compatíveis.';
 else note.textContent='Você pode marcar vários tipos de entidade ao mesmo tempo. A esfera não se aplica aos tipos atualmente selecionados.';
}
function companyFiltersFromUi(cursor=null,natureOverride=null){
 const f={};
 const put=(k,v)=>{if(v!==''&&v!=null)f[k]=v};
 put('uf',$('#csUf').value);put('municipio',$('#csMunicipio').value);put('cnae',digits($('#csCnae').value));put('porte',$('#csPorte').value);put('situacao',$('#csSituacao').value);
 const nature=natureOverride||digits($('#csNatureza').value);if(nature)put('natureza',nature);
 put('capital_min',$('#csCapMin').value);put('capital_max',$('#csCapMax').value);put('abertura_de',$('#csAberturaDe').value);put('abertura_ate',$('#csAberturaAte').value);
 if($('#csSimples').value!=='')put('simples',$('#csSimples').value);
 if($('#csMei').value!=='')put('mei',$('#csMei').value);
 if(cursor)put('cursor',cursor);
 return f;
}
function prepareEntityGroup(){
 const entities=selectedEntityTypes(),sphere=$('#csSphere').value,manual=digits($('#csNatureza').value);
 let codes=[...new Set(entities.flatMap(entity=>entityCodes(entity,sphere)))];
 if(manual){if(codes.length&&!codes.includes(manual))throw new Error('A natureza jurídica informada não pertence aos Tipos de entidade/Esfera selecionados.');codes=[manual]}
 if(!codes.length)return null;
 return {codes,index:0,cursors:{},finished:{},labels:codes.map(c=>COMPANY_NATURE_LABELS[c]||c),entities:[...entities]};
}
async function fetchNextEntityPage(group){
 while(group.index<group.codes.length){
  const code=group.codes[group.index],cursor=group.cursors[code]||null;
  const filters=companyFiltersFromUi(cursor,code);
  const data=await companyInvoke({action:'search',filters});
  const arr=Array.isArray(data.data)?data.data:[];
  const next=data.meta?.next_cursor||null;
  group.cursors[code]=next;
  if(!next){group.finished[code]=true;group.index++}
  if(arr.length)return {data,arr,code};
 }
 return {data:{meta:{}},arr:[],code:null};
}

function cnpjiaContactsFromFull(resp){

 (Array.isArray(d.telefones)?d.telefones:[]).forEach(p=>addPhone([p?.ddd,p?.numero].filter(Boolean).join('')));

 (Array.isArray(d.contatos_extras)?d.contatos_extras:[]).forEach(c=>{

function interactionStatusLabel(s){return ({pendente:'Pendente',realizada:'Realizada',sem_resposta:'Sem resposta',aguardando_retorno:'Aguardando retorno',retorno_agendado:'Retorno agendado',convertida:'Convertida em oportunidade',encerrada:'Encerrada'})[s]||String(s||'Pendente')}
function interactionStatusClass(s){return ['encerrada','convertida'].includes(s)?'good':['pendente','sem_resposta','aguardando_retorno','retorno_agendado'].includes(s)?'warn':''}
function interactionIsOpen(a){return !['encerrada','convertida'].includes(String(a.status||'pendente'))}

function interactionReminder(a){if(!interactionIsOpen(a))return null;let now=Date.now();if(a.next_action_at){let due=new Date(a.next_action_at).getTime();if(Number.isFinite(due)&&due<now)return {level:'bad',text:'Próxima ação vencida'};}if(['aguardando_retorno','retorno_agendado'].includes(a.status)&&!a.next_action_at)return {level:'warn',text:'Defina a data do próximo retorno'};let days=interactionAgeDays(a);if(days>=4)return {level:'bad',text:`Status sem atualização há ${days} dias`};if(days>=2)return {level:'warn',text:`Status sem atualização há ${days} dias`};return null}

function findArrayByKeys(obj,keys){
 if(!obj||typeof obj!=='object')return null;
 for(const k of Object.keys(obj)){if(keys.includes(k)&&Array.isArray(obj[k]))return obj[k]}
 for(const v of Object.values(obj)){if(v&&typeof v==='object'){const r=findArrayByKeys(v,keys);if(r)return r}}
 return null;
}
function findObjectByKey(obj,key){
 if(!obj||typeof obj!=='object')return null;if(obj[key]&&typeof obj[key]==='object')return obj[key];
 for(const v of Object.values(obj)){if(v&&typeof v==='object'){const r=findObjectByKey(v,key);if(r)return r}}return null;
}

function calcOrderFinance(products,shipping,commissionRate,saasRate,cardRate,refund){
 const total=Number(products||0)+Number(shipping||0);
 const commission=total*Number(commissionRate||0)/100;
 const saas=total*Number(saasRate||0)/100;
 const card=total*Number(cardRate||0)/100;
 const net=Math.max(0,total-commission-saas-card-Number(refund||0));
 return {total,commission,saas,card,net};
}
function suggestPayoutDate(orderDate,paymentMethod){
 if(!orderDate)return '';
 let d=new Date(orderDate+'T12:00:00');
 d.setDate(d.getDate()+(paymentMethod==='cartao corporativo'?32:9));
 return d.toISOString().slice(0,10);
}

 <div class="card toolbar" style="margin-bottom:12px"><div class="field"><label>Buscar</label><input id="oq" value="${esc(window._orderQ||'')}" placeholder="Pedido, comprador, fornecedor..."></div><div class="field"><label>Status</label><select id="ost"><option value="">Todos</option>${['aberto','pago','atrasado','inadimplente','cancelado'].map(x=>`<option value="${x}" ${st===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>De</label><input id="of" type="date" value="${from}"></div><div class="field"><label>Até</label><input id="ot" type="date" value="${to}"></div><button class="btn alt" id="oclear">Limpar</button></div>

 <div class="card scroll"><table class="table"><thead><tr><th>Pedido</th><th>Data</th><th>Comprador</th><th>Fornecedor</th><th>Total</th><th>Comissão</th><th>Líquido forn.</th><th>Pagamento</th><th>Pedido</th><th>Repasse</th><th>Ações</th></tr></thead><tbody>
 ${filtered.map(x=>{let l=cache.leads.find(z=>z.id===x.lead_id);return `<tr><td><b>${esc(x.order_number||'-')}</b></td><td>${fmt(x.order_date)}</td><td>${esc(l?.lead_code||'')} · ${esc(l?.company_name||'')}</td><td>${esc(x.supplier_name||'-')}</td><td>${money(x.order_value)}</td><td>${money(x.commission_value)}</td><td>${money(x.net_supplier_value)}</td><td>${esc(x.payment_method||'')}</td><td><span class="badge ${x.payment_status==='pago'?'good':x.payment_status==='cancelado'?'bad':x.payment_status==='atrasado'||x.payment_status==='inadimplente'?'warn':''}">${esc(x.payment_status)}</span></td><td><span class="badge ${x.payout_status==='pago'?'good':x.payout_status==='retido'?'warn':''}">${esc(x.payout_status||'pendente')}</span></td><td><div class="row"><button class="btn alt view-order" data-id="${x.id}">Abrir</button><button class="btn alt edit-order" data-id="${x.id}">Editar</button>${x.payment_status!=='pago'&&x.payment_status!=='cancelado'?`<button class="btn alt pay-order" data-id="${x.id}">Marcar pago</button>`:''}</div></td></tr>`}).join('')}</tbody></table></div>`;
 $('#newOrder').onclick=()=>orderForm();
 ['oq','ost','of','ot'].forEach(id=>$('#'+id).onchange=$('#'+id).oninput=()=>{window._orderQ=$('#oq').value;window._orderStatus=$('#ost').value;window._orderFrom=$('#of').value;window._orderTo=$('#ot').value;orders()});
 $('#oclear').onclick=()=>{window._orderQ='';window._orderStatus='';window._orderFrom='';window._orderTo='';orders()};
 document.querySelectorAll('.view-order').forEach(b=>b.onclick=()=>orderDetail(cache.orders.find(x=>x.id===b.dataset.id)));
 document.querySelectorAll('.edit-order').forEach(b=>b.onclick=()=>orderForm(null,null,cache.orders.find(x=>x.id===b.dataset.id)));
 document.querySelectorAll('.pay-order').forEach(b=>b.onclick=async()=>{const ord=cache.orders.find(x=>x.id===b.dataset.id);if(!ord)return;const {error}=await supabase.from('yepii_orders').update({payment_status:'pago',paid_at:new Date().toISOString()}).eq('id',ord.id);if(error){alert('Não foi possível atualizar o pedido: '+error.message);return}await refresh();orders()});
}

function exportExcel(opts={}){
 if(typeof XLSX==='undefined'){alert('A biblioteca de Excel ainda está carregando. Tente novamente em alguns segundos.');return}
 const uid=opts.scopeUser||null, from=opts.weekStart||null,to=opts.weekEnd||null;
 const leadIds=uid?new Set(cache.leads.filter(x=>x.assigned_to===uid).map(x=>x.id)):null;
 const includeLead=l=>!uid||leadIds.has(l.id)||cache.acts.some(a=>a.lead_id===l.id&&a.created_by===uid)||cache.orders.some(o=>o.lead_id===l.id&&o.created_by===uid);
 const leads=cache.leads.filter(includeLead);
 const ids=new Set(leads.map(x=>x.id));
 const acts=cache.acts.filter(x=>ids.has(x.lead_id)&&(!uid||x.created_by===uid)&&(!from||x.activity_at?.slice(0,10)>=from)&&(!to||x.activity_at?.slice(0,10)<=to));
 const orders=cache.orders.filter(x=>ids.has(x.lead_id)&&(!uid||x.created_by===uid)&&(!from||x.order_date>=from)&&(!to||x.order_date<=to));
 const analyses=cache.analyses.filter(x=>ids.has(x.lead_id));
 const leadName=id=>{let l=cache.leads.find(x=>x.id===id);return l?`${l.lead_code||''} - ${l.company_name||''}`:''};
 const who=id=>userName(id);
 const sheets={
 'Leads':leads.map(l=>{const b=latestBdcAnalysis(l.id)||{};return {ID:l.lead_code,CNPJ:l.cnpj,'Razão social':l.company_name,'Nome fantasia':l.trade_name,'Pública/Privada':l.company_sector_type==='publica'?'Pública':l.company_sector_type==='privada'?'Privada':'Não informado',Segmento:l.segment,CNAE:l.main_cnae,'Atividade principal':l.main_activity,'Natureza jurídica':l.legal_nature,'Capital social':l.capital_social,'Data abertura':l.opening_date,'Situação Receita':l.receita_status,Porte:l.company_size,'Tempo empresa (anos)':b.company_age_years,'BigData última consulta':(latestBdcQuery(l.id)?.queried_at||b.analyzed_at),'BigData consultado por':(latestBdcQuery(l.id)?.queried_by?who(latestBdcQuery(l.id).queried_by):''),'BigData Murabei':b.murabei_score,'BigData Quantum':b.quantum_score,'BigData score médio':b.score_avg,'BigData decisão':b.decision,'BigData limite sugerido':b.suggested_limit,'BigData MEI':b.is_mei===true?'Sim':b.is_mei===false?'Não':'','BigData ações judiciais':b.has_judicial_action===true?'Sim':b.has_judicial_action===false?'Não':'','BigData dívida trabalhista':b.has_labor_debt===true?'Sim':b.has_labor_debt===false?'Não':'','BigData dívida pública':(b.has_government_debt??b.has_other_public_debts)===true?'Sim':(b.has_government_debt??b.has_other_public_debts)===false?'Não':'','BigData restrições Quod':b.has_quod_restrictions===true?'Sim':b.has_quod_restrictions===false?'Não':'',Endereço:l.street,Número:l.street_number,Complemento:l.address_complement,Bairro:l.neighborhood,Cidade:l.city,UF:l.state,CEP:l.postal_code,Prioridade:l.priority,Status:leadStatusLabel(l.status),'Responsável':who(l.assigned_to),'Score médio':l.score_avg,'Situação crédito':creditStatusLabel(l),'Limite de crédito':creditStatus(l)==='approved'?l.credit_limit:null,'Alerta crédito':l.credit_alert_reason,'Criado em':l.created_at}}),
 'Contatos':cache.contacts.filter(c=>ids.has(c.lead_id)).map(c=>({Empresa:leadName(c.lead_id),Nome:c.full_name,Cargo:c.job_title,Telefone:c.phone,WhatsApp:c.whatsapp,'E-mail':c.email,LinkedIn:c.linkedin,Principal:c.is_primary?'Sim':'Não',Observações:c.notes})),
 'Atividades':acts.map(a=>({Data:a.activity_at,Empresa:leadName(a.lead_id),Contato:contactName(a.contact_id),Usuário:who(a.created_by),Canal:a.channel,Status:interactionStatusLabel(a.status||'pendente'),Resultado:a.outcome,'Resumo/resultado':a.result,Observações:a.notes,'Próximo passo':a.next_action,'Próximo retorno':a.next_action_at,'Última alteração':a.updated_at,'Alterado por':who(a.updated_by)})),
 'Crédito':analyses.map(a=>{const pc=(cache.manualChecks||[]).find(x=>x.lead_id===a.lead_id&&x.check_type==='protestos_cartorio');return {Data:a.analyzed_at,Empresa:leadName(a.lead_id),Fonte:a.source,'Murabei':a.murabei_score,'Quantum':a.quantum_score,'Score médio':a.score_avg,Decisão:a.decision,'Motivos':textList(a.decision_reasons).join('; '),'Limite sugerido':a.suggested_limit,'Limite aprovado':a.approved_limit,'Protestos/Cartório':pc?.status==='consta'?'Consta':pc?.status==='nao_consta'?'Não consta':'Pendente','Verificado por':pc?.checked_by?who(pc.checked_by):'','Verificado em':pc?.checked_at||'','Referência protestos':pc?.reference||'','Observação protestos':pc?.notes||'','Ação judicial':a.has_judicial_action?'Sim':'Não','Dívida trabalhista':a.has_labor_debt?'Sim':'Não','Dívida pública':a.has_government_debt||a.has_other_public_debts?'Sim':'Não','Restrição Quod':a.has_quod_restrictions?'Sim':'Não'}}),
 'Pedidos':orders.map(o=>({Pedido:o.order_number,Data:o.order_date,Empresa:leadName(o.lead_id),Fornecedor:o.supplier_name,'CNPJ fornecedor':o.supplier_cnpj,Usuário:who(o.created_by),'Produtos':o.products_total,Frete:o.shipping_value,'Valor total':o.order_value,'Comissão %':o.commission_rate,'Comissão Yepii':o.commission_value,'SaaS %':o.saas_rate,'Taxa SaaS':o.saas_value,'Cartão %':o.card_fee_rate,'Custo cartão':o.card_fee_value,'Líquido fornecedor':o.net_supplier_value,'Forma pagamento':o.payment_method,'Crédito usado':o.credit_used,Recompra:o.is_repurchase?'Sim':'Não',Vencimento:o.due_date,'Pago em':o.paid_at,Status:o.payment_status,'Previsão repasse':o.payout_expected_at,'Status repasse':o.payout_status,'Repasse em':o.payout_at,'Estorno/devolução':o.refund_value,'NF':o.invoice_number,Observações:o.notes})),
 'Itens dos pedidos':cache.orderItems.filter(i=>orders.some(o=>o.id===i.order_id)).map(i=>{let o=cache.orders.find(x=>x.id===i.order_id);return {Pedido:o?.order_number||'',Descrição:i.description,SKU:i.sku,Quantidade:i.quantity,'Valor unitário':i.unit_price,Subtotal:i.subtotal}}),
 'Histórico pedidos':cache.orderHistory.filter(h=>orders.some(o=>o.id===h.order_id)).map(h=>{let o=cache.orders.find(x=>x.id===h.order_id);return {Pedido:o?.order_number||'',Ação:h.action,Usuário:who(h.changed_by),Data:h.created_at}}),
 'Tarefas':cache.tasks.filter(t=>ids.has(t.lead_id)&&(!uid||t.assigned_to===uid)).map(t=>({Empresa:leadName(t.lead_id),Responsável:who(t.assigned_to),Tipo:t.task_type,Vencimento:t.due_at,Prioridade:t.priority,Status:t.status,Concluída:t.completed_at,Observações:t.notes})),
 'Eventos de crédito':cache.creditEvents.filter(e=>ids.has(e.lead_id)).map(e=>({Data:e.event_date,Empresa:leadName(e.lead_id),Tipo:e.event_type,Valor:e.amount,Observações:e.notes})),
 'Metas gerais':cache.weeklyTargets.map(t=>({Semana:t.week_start,'Leads planejados':t.leads_planned,'Contatos meta':t.contacts_target,'Novos compradores meta':t.new_buyers_target,'Recompras meta':t.repurchases_target,'Pedidos meta':t.orders_target,'GMV meta':t.gmv_target,Observações:t.notes})),
 'Metas por usuário':cache.userTargets.map(t=>({Semana:t.week_start,Usuário:who(t.user_id),'Leads meta':t.leads_target,'Contatos meta':t.contacts_target,'Novos compradores meta':t.new_buyers_target,'Recompras meta':t.repurchases_target,'Pedidos meta':t.orders_target,'GMV meta':t.gmv_target,Observações:t.notes}))
 };
 let total=leads.length,buyers=new Set(orders.map(x=>x.lead_id)).size,gmv=orders.filter(x=>x.payment_status!=='cancelado').reduce((s,x)=>s+Number(x.order_value||0),0);
 sheets['Resumo']=[{'Indicador':'Leads','Valor':total},{'Indicador':'Compradores únicos','Valor':buyers},{'Indicador':'Conversão %','Valor':total?buyers/total*100:0},{'Indicador':'Pedidos','Valor':orders.length},{'Indicador':'Recompras','Valor':orders.filter(x=>x.is_repurchase).length},{'Indicador':'GMV','Valor':gmv},{'Indicador':'Ticket médio','Valor':orders.length?gmv/orders.length:0},{'Indicador':'Crédito em aberto/atrasado/inadimplente','Valor':orders.filter(x=>['aberto','atrasado','inadimplente'].includes(x.payment_status)).reduce((s,x)=>s+Number(x.credit_used||0),0)}];
 const wb=XLSX.utils.book_new(); Object.entries(sheets).forEach(([name,rows])=>{let ws=XLSX.utils.json_to_sheet(rows.length?rows:[{Informação:'Sem dados'}]);XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31))});
 XLSX.writeFile(wb,`Yepii_CRM_${new Date().toISOString().slice(0,10)}.xlsx`);
}
function reports(){
 let total=cache.leads.length,buyers=new Set(cache.orders.map(x=>x.lead_id)).size,gmv=cache.orders.filter(x=>x.payment_status!=='cancelado').reduce((s,x)=>s+Number(x.order_value||0),0);
 let arr=[['Leads cadastrados',total],['Compradores únicos',buyers],['GMV acumulado',money(gmv)],['Ticket médio',money(cache.orders.length?gmv/cache.orders.length:0)],['Conversão lead→comprador',(total?((buyers/total)*100).toFixed(1):0)+'%'],['Recompras',cache.orders.filter(x=>x.is_repurchase).length],['Pedidos pagos',cache.orders.filter(x=>x.payment_status==='pago').length],['Atrasados/inadimplentes',cache.orders.filter(x=>['atrasado','inadimplente'].includes(x.payment_status)).length]];
 $('#main').innerHTML=`<div class="sectionTitle"><div><h2>Relatórios</h2><div class="muted">Visão consolidada e exportação completa do CRM</div></div><button class="btn" id="excelFull">Exportar Excel completo</button></div><div class="grid">${arr.map(x=>`<div class="card kpi"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="card" style="margin-top:12px"><h3>Conteúdo do Excel</h3><p class="muted">Abas: Resumo, Leads, Contatos, Atividades, Crédito, Pedidos, Itens dos pedidos, Histórico pedidos, Tarefas, Eventos de crédito, Metas gerais e Metas por usuário.</p></div>`;
 $('#excelFull').onclick=()=>exportExcel();
}


function team(){
 if(role!=='administrador'){$('#main').innerHTML='<div class="card"><h2>Equipe</h2><p>Somente o administrador pode alterar perfis.</p></div>';return}
 $('#main').innerHTML=`<div class="sectionTitle"><h2>Equipe</h2><button class="btn" id="invite">+ Adicionar usuário</button></div><div class="card scroll"><table class="table"><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Ativo</th></tr></thead><tbody>
 ${cache.team.map(x=>`<tr><td>${esc(x.full_name||'-')}</td><td>${esc(x.email)}</td><td><select class="role" data-u="${x.user_id}">${['administrador','gestor_comercial','comercial','credito_financeiro','marketing','visualizacao'].map(r=>`<option ${r===x.role?'selected':''}>${r}</option>`).join('')}</select></td><td>${x.active?'Sim':'Não'}</td></tr>`).join('')}</tbody></table></div>`;
 document.querySelectorAll('.role').forEach(s=>s.onchange=async()=>{let{error}=await supabase.from('yepii_team_members').update({role:s.value}).eq('user_id',s.dataset.u);if(error)alert(error.message);else await refresh()});
 $('#invite').onclick=inviteUser;
}
function inviteUser(){
 let d=modal(`<h2>Adicionar usuário</h2><p class="muted">A pessoa receberá um convite por e-mail para acessar o CRM.</p><div class="field"><label>Nome</label><input id="nm"></div><div class="field"><label>E-mail</label><input id="em" type="email"></div><div class="field"><label>Perfil</label><select id="rl"><option value="gestor_comercial">Gestor Comercial</option><option value="comercial">Comercial</option><option value="credito_financeiro">Crédito/Financeiro</option><option value="marketing">Marketing</option><option value="visualizacao">Visualização</option><option value="administrador">Administrador</option></select></div><button class="btn" id="send">Enviar convite</button><div id="st" class="muted" style="margin-top:10px"></div>`);
 d.querySelector('#send').onclick=async()=>{const email=d.querySelector('#em').value.trim();if(!email){d.querySelector('#st').textContent='Informe o e-mail.';return}d.querySelector('#send').disabled=true;d.querySelector('#st').textContent='Enviando convite...';try{const {data:{session}}=await supabase.auth.getSession();const {data,error}=await supabase.functions.invoke('yepii-invite-user',{body:{user_token:session.access_token,email,full_name:d.querySelector('#nm').value.trim(),role:d.querySelector('#rl').value}});if(error)throw error;if(data?.error)throw new Error(data.error);d.querySelector('#st').textContent='Convite enviado com sucesso.';await refresh();setTimeout(()=>{d.remove();team()},700)}catch(e){d.querySelector('#st').textContent='Erro: '+(e?.message||e)}finally{d.querySelector('#send').disabled=false}};
}

async function refresh(){await load();render()}
async function init(){
 let{data:{session}}=await supabase.auth.getSession();
 if(!session){login();return}
 me=session.user;
 await load();
 if(role==='comercial' && dashboardScope==='geral') dashboardScope='me';
 if(!cache.team.find(x=>x.user_id===me.id)){
   try{
     await supabase.rpc('yepii_bootstrap_admin',{p_full_name:me.email?.split('@')[0]||'Administrador'});
     await load();
   }catch(e){}
 }
 shell(); render();
}
supabase.auth.onAuthStateChange(()=>setTimeout(init,0));
init();
</script>
</body></html>
