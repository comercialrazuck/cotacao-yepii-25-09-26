<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yepii | Relatórios de Cotações</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');:root{--o:#ff6600;--t:#242424;--m:#737373;--b:#e7e7e9;--bg:#f6f6f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Montserrat,Arial,sans-serif;color:var(--t)}.wrap{width:min(1240px,96vw);margin:22px auto}.card{background:#fff;border:1px solid var(--b);border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.04)}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.brand{display:flex;gap:14px;align-items:center}.brand img{width:130px;max-height:55px;object-fit:contain}.brand-fallback{font-size:34px;font-weight:800;font-style:italic;color:var(--o)}h1{font-size:21px;margin:0}.muted{color:var(--m);font-size:13px}.btn{border:0;border-radius:10px;padding:10px 14px;font:700 13px Montserrat;cursor:pointer}.primary{background:var(--o);color:#fff}.secondary{background:#fff;border:1px solid #ddd;color:#333}.hidden{display:none!important}.login{max-width:460px;margin:70px auto}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:700;color:#666}.field input,.field select{border:1px solid #ddd;border-radius:9px;padding:10px;font:500 13px Montserrat;background:#fff}.filters{display:grid;grid-template-columns:1fr 1fr 1.2fr auto;gap:10px;align-items:end;margin-bottom:14px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:#fff;border:1px solid var(--b);border-radius:14px;padding:15px}.metric span{display:block;color:#777;font-size:11px}.metric b{display:block;margin-top:5px;font-size:22px}.section{margin-top:18px}.section h2{font-size:17px;margin:0 0 12px}.funnel{display:grid;gap:8px}.funnel-row{display:grid;grid-template-columns:160px 1fr 70px;gap:10px;align-items:center}.bar{height:14px;background:#eee;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff8a36,#ff6600);border-radius:999px}.table-wrap{overflow:auto;border:1px solid var(--b);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:1000px}.table th,.table td{padding:10px;border-bottom:1px solid #eee;font-size:12px;text-align:left}.table th{background:#fafafa;color:#666}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.admin-users{margin-top:18px}.user-form{display:grid;grid-template-columns:1.1fr 1.2fr 1fr 1fr auto;gap:8px;align-items:end}.pill{display:inline-block;border-radius:999px;background:#f2f2f3;padding:4px 8px;font-size:11px}.msg{margin-top:10px;font-size:13px;color:#a00000}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.filters,.user-form{grid-template-columns:1fr 1fr}.funnel-row{grid-template-columns:120px 1fr 55px}}@media(max-width:560px){.metrics,.filters,.user-form{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div id="login" class="login card"><div class="brand"><img src="/assets/yepii-logo.png" alt="Yepii" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="brand-fallback" style="display:none">Yepii</div></div><h1 style="margin-top:18px">Relatórios de Cotações</h1><p class="muted">Acesso interno Yepii</p><div class="field"><label>E-mail</label><input id="email" type="email"></div><div class="field" style="margin-top:10px"><label>Senha</label><input id="password" type="password"></div><button id="loginBtn" class="btn primary" style="margin-top:14px">Entrar</button><div id="loginMsg" class="msg"></div></div><div id="app" class="wrap hidden"><div class="card"><div class="top"><div><div class="brand"><img src="/assets/yepii-logo.png" alt="Yepii" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="brand-fallback" style="display:none">Yepii</div></div><h1>Relatórios de Cotações</h1><div id="profileText" class="muted"></div></div><div class="toolbar"><a href="/admin" class="btn secondary" style="text-decoration:none">Cotações</a><button id="exportBtn" class="btn secondary">Exportar Excel</button><button id="logoutBtn" class="btn secondary">Sair</button></div></div><div class="filters"><div class="field"><label>De</label><input id="from" type="date"></div><div class="field"><label>Até</label><input id="to" type="date"></div><div class="field"><label>Responsável</label><input id="responsible" placeholder="Todos"></div><button id="filterBtn" class="btn primary">Atualizar</button></div><div id="metrics" class="metrics"></div><div class="section"><h2>Funil</h2><div id="funnel" class="funnel"></div></div><div class="section"><h2>Cotações</h2><div class="table-wrap"><table class="table"><thead><tr><th>Cotação</th><th>Empresa</th><th>Responsável</th><th>Data</th><th>Valor</th><th>Status</th><th>E-mail entregue</th><th>Aberto</th><th>Clicado</th><th>Visualizada</th><th>Aceita</th></tr></thead><tbody id="tbody"></tbody></table></div></div><div id="usersBox" class="admin-users hidden"><h2>Usuários e permissões</h2><div class="user-form"><div class="field"><label>Nome</label><input id="uName"></div><div class="field"><label>E-mail</label><input id="uEmail" type="email"></div><div class="field"><label>Senha inicial</label><input id="uPassword" type="password"></div><div class="field"><label>Perfil</label><select id="uRole"><option value="visualizacao">Visualização / Relatórios</option><option value="comercial">Comercial</option><option value="gestor_comercial">Gestor comercial</option><option value="administrador">Administrador</option></select></div><button id="createUserBtn" class="btn primary">Criar usuário</button></div><div id="usersMsg" class="msg"></div><div class="table-wrap" style="margin-top:12px"><table class="table" style="min-width:700px"><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Ativo</th></tr></thead><tbody id="usersBody"></tbody></table></div></div></div></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const supabase=createClient('https://szcahilagrdnlvogngxg.supabase.co','sb_publishable_9OnuKQOmBQR7TArHu3-X7g_HXbQpQoc');const $=x=>document.getElementById(x),money=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});let current=null;async function sess(){const{data:{session}}=await supabase.auth.getSession();return session}async function api(path,opts={}){const s=await sess(),r=await fetch(path,{...opts,headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token,...opts.headers}}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Erro');return d}function d(v){if(!v)return'-';return new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}function metric(label,value){return`<div class="metric"><span>${label}</span><b>${value}</b></div>`}async function load(){const p=new URLSearchParams();if($('from').value)p.set('from',$('from').value);if($('to').value)p.set('to',$('to').value);if($('responsible').value.trim())p.set('responsible',$('responsible').value.trim());current=await api('/api/reports?'+p);const m=current.metrics;$('profileText').textContent=`${current.profile.full_name||current.profile.email} · ${current.profile.role}`;$('metrics').innerHTML=[metric('Cotações',m.quotes),metric('Valor cotado',money.format(m.quoted_value)),metric('Valor aceito',money.format(m.accepted_value)),metric('Conversão',m.conversion_rate+'%'),metric('Entrega de e-mail',m.delivery_rate+'%'),metric('Abertura',m.open_rate+'%'),metric('Clique',m.click_rate+'%'),metric('Visualização',m.view_rate+'%'),metric('Conversão após visualização',m.conversion_after_view+'%'),metric('Conversão após clique',m.conversion_after_click+'%'),metric('Envio → abertura',m.avg_send_to_open_hours+' h'),metric('Visualização → aceite',m.avg_view_to_accept_hours+' h')].join('');const f=[['Enviadas',current.quotes.filter(q=>q.status!=='draft').length],['Entregues',current.quotes.filter(q=>q.buyer_email_delivered_at).length],['Abertas',current.quotes.filter(q=>q.buyer_email_opened_at).length],['Cliques',current.quotes.filter(q=>q.buyer_email_clicked_at).length],['Visualizadas',current.quotes.filter(q=>q.first_viewed_at).length],['Aceitas',current.quotes.filter(q=>q.status==='accepted').length]],max=Math.max(1,f[0][1]);$('funnel').innerHTML=f.map(([l,n])=>`<div class="funnel-row"><span>${l}</span><div class="bar"><i style="width:${Math.max(2,n/max*100)}%"></i></div><b>${n}</b></div>`).join('');$('tbody').innerHTML=current.quotes.map(q=>`<tr><td>${q.quote_number||''}</td><td>${q.company||''}</td><td>${q.quote_responsible||''}</td><td>${q.quote_date||''}</td><td>${money.format(Number(q.total||0))}</td><td><span class="pill">${q.status}</span></td><td>${d(q.buyer_email_delivered_at)}</td><td>${d(q.buyer_email_opened_at)}</td><td>${d(q.buyer_email_clicked_at)}</td><td>${d(q.first_viewed_at)}</td><td>${d(q.accepted_at)}</td></tr>`).join('');if(current.profile.role==='administrador'){usersBox.classList.remove('hidden');await loadUsers()}}async function loadUsers(){const d=await api('/api/team-users');$('usersBody').innerHTML=d.users.map(u=>`<tr><td>${u.full_name||''}</td><td>${u.email||''}</td><td>${u.role}</td><td>${u.active?'Sim':'Não'}</td></tr>`).join('')}$('loginBtn').onclick=async()=>{loginMsg.textContent='';const{error}=await supabase.auth.signInWithPassword({email:email.value,password:password.value});if(error){loginMsg.textContent=error.message;return}login.classList.add('hidden');app.classList.remove('hidden');try{await load()}catch(e){alert(e.message)}};$('logoutBtn').onclick=async()=>{await supabase.auth.signOut();location.reload()};$('filterBtn').onclick=load;$('createUserBtn').onclick=async()=>{usersMsg.textContent='';try{await api('/api/team-users',{method:'POST',body:JSON.stringify({full_name:uName.value,email:uEmail.value,password:uPassword.value,role:uRole.value})});uName.value=uEmail.value=uPassword.value='';usersMsg.style.color='#176b35';usersMsg.textContent='Usuário criado.';await loadUsers()}catch(e){usersMsg.style.color='#a00000';usersMsg.textContent=e.message}};$('exportBtn').onclick=()=>{if(!current)return;const wb=XLSX.utils.book_new(),m=current.metrics,s=[['Relatório de Cotações Yepii'],[],['Indicador','Valor'],['Cotações',m.quotes],['Valor cotado',m.quoted_value],['Valor aceito',m.accepted_value],['Conversão (%)',m.conversion_rate],['Entrega de e-mail (%)',m.delivery_rate],['Abertura (%)',m.open_rate],['Clique (%)',m.click_rate],['Visualização (%)',m.view_rate],['Conversão após visualização (%)',m.conversion_after_view],['Conversão após clique (%)',m.conversion_after_click]],detail=current.quotes.map(q=>({Cotação:q.quote_number,Empresa:q.company,CNPJ:q.cnpj,Responsável:q.quote_responsible,Data:q.quote_date,Valor:Number(q.total||0),Status:q.status,'E-mail entregue':q.buyer_email_delivered_at,'E-mail aberto':q.buyer_email_opened_at,'Link clicado':q.buyer_email_clicked_at,Visualizada:q.first_viewed_at,Aceita:q.accepted_at}));XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s),'Resumo');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(detail),'Cotacoes');XLSX.writeFile(wb,'relatorio_cotacoes_yepii.xlsx')};const{data:{session}}=await supabase.auth.getSession();if(session){login.classList.add('hidden');app.classList.remove('hidden');load().catch(e=>alert(e.message))}</script></body></html>
